<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      background-color: #fff;
      padding: 20px;
      border: 3px solid #000;
      border-radius: 8px;
    }

    /* Grid Layout */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    @media (min-width: 768px) {
      .product-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    /* Product Card */
    .product-card {
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Discount Badge */
    .badge {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #4b1178;
      color: #fff;
      font-size: 9px;
      font-weight: bold;
      padding: 3px 5px;
      border-top-left-radius: 10px;
      border-bottom-right-radius: 8px;
      text-align: center;
      line-height: 1.1;
      z-index: 1;
    }

    /* Image Styling */
    .image-container {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 8px;
      background-color: #fefefe;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Details Styling */
    .title {
      font-size: 11px;
      font-weight: 700;
      color: #212121;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 28px;
      line-height: 1.3;
    }

    .unit {
      font-size: 10px;
      color: #757575;
      margin-bottom: 8px;
    }

    .price-container {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 8px;
    }

    .current-price {
      font-size: 12px;
      font-weight: bold;
      color: #000;
    }

    .original-price {
      font-size: 10px;
      color: #9e9e9e;
      text-decoration: line-through;
    }

    /* Buttons */
    .add-btn {
      width: 100%;
      padding: 6px 0;
      background-color: #fff;
      border: 1px solid #ff3e6c;
      color: #ff3e6c;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      background-color: #fff0f3;
    }

    .pick-btn-container {
      position: relative;
      text-align: center;
    }

    .sub-text {
      font-size: 8px;
      color: #757575;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">

      }

    // Card Render કરવા માટેનું ફંક્શન
    const gridContainer = document.getElementById('productGrid');

    products.forEach(item => {
      const card = document.createElement('div');
      card.className = 'product-card';

      card.innerHTML = `
        <div class="badge">${item.discount.replace(' ', '<br>')}</div>
        <div class="image-container">
          <img src="${item.image}" alt="${item.title}">
        </div>
        <div class="title">${item.title}</div>
        <div class="unit">${item.unit}</div>
        <div class="price-container">
          <span class="current-price">₹${item.price}</span>
          <span class="original-price">₹${item.originalPrice}</span>
        </div>
        <div class="btn-box">
          <button class="add-btn">${item.btnText}</button>
          ${item.options ? `<div class="sub-text">${item.options}</div>` : ''}
        </div>
      `;

      gridContainer.appendChild(card);
    });
  </script>
</body>
</html>
