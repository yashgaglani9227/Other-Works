<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart - Ecommerce Landing Page</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

        /* Top Bar */
        .top-bar {
            background-color: #f1f3f5;
            padding: 6px 50px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6c757d;
            border-bottom: 1px solid #e9ecef;
        }

        /* Header / Navbar */
        header {
            background-color: #fff;
            padding: 15px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0aad0a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            flex: 0 1 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            outline: none;
        }

        .search-box button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
        }

        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 18px;
            color: #495057;
        }

        .header-icons i {
            cursor: pointer;
            position: relative;
        }

        .badge-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: #0aad0a;
            color: white;
            font-size: 10px;
            border-radius: 50%;
            padding: 2px 6px;
        }

        /* Secondary Navigation */
        nav {
            background-color: #fff;
            padding: 12px 50px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 25px;
            font-weight: 600;
            font-size: 14px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            transition: 0.2s;
        }

        nav a:hover {
            color: #0aad0a;
        }

        /* Container & Grid Layout */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .heading {
            margin-bottom: 20px;
            font-size: 22px;
            color: #212529;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* Product Card */
        .product-card {
            background-color: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        /* Discount Badge */
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: #dc3545;
            color: #fff;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .category {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #212529;
        }

        .rating {
            color: #ffc107;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .rating span {
            color: #6c757d;
            margin-left: 5px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 16px;
            font-weight: bold;
            color: #212529;
        }

        .old-price {
            font-size: 13px;
            color: #888;
            text-decoration: line-through;
            margin-left: 5px;
        }

        .add-btn {
            background-color: #0aad0a;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .add-btn:hover {
            background-color: #088a08;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header, nav, .top-bar {
                padding-left: 15px;
                padding-right: 15px;
            }

            .search-box {
                display: none; /* Hide on small screens for simplicity */
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <span>Super Value Deals - Save more with coupons</span>
        <span>English <i class="fa-solid fa-chevron-down"></i></span>
    </div>

    <!-- Main Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-cart-shopping"></i> FreshCart
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search for products...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="header-icons">
            <i class="fa-regular fa-heart"><span class="badge-count">2</span></i>
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-bag-shopping"><span class="badge-count">3</span></i>
        </div>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <a href="#"><i class="fa-solid fa-grid-2"></i> All Departments</a>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Stores</a>
        <a href="#">Mega Menu</a>
        <a href="#">Pages</a>
        <a href="#">Account</a>
    </nav>

    <!-- Product Grid Container -->
    <div class="container">
        

        <div class="product-grid">

            
    </div>

</body>
</html>
